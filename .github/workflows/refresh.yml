name: refresh-rb-mentions
on:
  schedule:
    - cron: '0 11 * * 1'          # Mondays 11:00 UTC — after the weekend shows
  workflow_dispatch:               # the "Run workflow" button (works from mobile web)
    inputs:
      limit:
        description: 'Episodes to process (blank = all ~749)'
        required: false
        default: ''
      no_fwar:
        description: 'Skip the WAR join (faster test run)'
        type: boolean
        default: false
      fwar_only:
        description: 'Skip scraping; just recompute WAR for players in Supabase'
        type: boolean
        default: false
jobs:
  run:
    runs-on: ubuntu-latest   # open network: reaches podscripts + baseball-reference
    permissions:
      contents: write        # lets the workflow commit the rebuilt index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Run pipeline
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.no_fwar }}" = "true" ]; then ARGS="$ARGS --no-fwar"; fi
          if [ "${{ inputs.fwar_only }}" = "true" ]; then ARGS="$ARGS --fwar-only"; fi
          echo "running: python pipeline.py $ARGS"
          python pipeline.py $ARGS
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: mentions-csv, path: mentions_vs_fwar.csv }

      # Rebuild the public chart from the fresh table and commit it, so the
      # GitHub Pages site self-updates. Skipped on --limit test runs.
      - name: Rebuild & commit chart
        if: ${{ inputs.limit == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python build_chart.py
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chart: automated data refresh"
          git push
